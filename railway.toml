[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health/live"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[volumes]]
mountPath = "/data"

[environments.production.deploy]
numReplicas = 1

# ─── Scheduled Jobs ──────────────────────────────────────────────────────────
# Railway config-as-code has NO [[cron]] syntax — blocks of that shape are
# silently ignored, and a dedicated Railway cron service could not share this
# service's /data volume. Scheduled work (nightly ingest, weekly lint) runs
# via .github/workflows/scheduled.yml, which calls the deployed app's API.

