version: 2
updates:
  # npm dependencies — weekly, grouped to reduce PR noise
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Majors deliberately deferred (reverted from the PR #172 group bump);
      # remove an entry here when ready to take that migration on.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      ai-sdks:
        patterns:
          - "@anthropic-ai/*"
          - "openai"
          - "@google/*"
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "chore"
      include: scope

  # GitHub Actions — weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: scope
